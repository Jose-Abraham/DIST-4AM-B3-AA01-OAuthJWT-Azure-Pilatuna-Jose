version: '3.8'

services:
    rabbitmq:
        image: rabbitmq:4-management
        container_name: rabbitmqA-compose
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: admin
            RABBITMQ_DEFAULT_PASS: admin123
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks: 
            - distribuidos-network

    oauthjwt:
        build:
            context: ./OAuthJWT/OAuthJWT
            dockerfile: Dockerfile
        image: acraplicacionesdistribuidas.azurecr.io/oauth-service:v1
        container_name: oauthjwt-api-compose
        ports:
            - "5003:8080"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: "http://+:8080"
        networks:
            - distribuidos-network

    categoria:
        build:
            context: ./CategoriaA/CategoriaA.Api
            dockerfile: Dockerfile
        image: acraplicacionesdistribuidas.azurecr.io/categoria-service:v1
        container_name: categoria-api-compose
        ports:
            - "5001:8080"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: "http://+:8080"
            ConnectionStrings__CategoriasConnection: "Server=tcp:jose-sqlserver-distribuidas3.database.windows.net,1433;Initial Catalog=CategoriaDB_A;Persist Security Info=False;User ID=sqladminuser;Password=JoseAzure2026@;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
            RabbitMQ__HostName: rabbitmq
            RabbitMQ__Port: 5672
            RabbitMQ__UserName: admin
            RabbitMQ__Password: admin123
            RabbitMQ__QueueName: categoria_creada
        depends_on: 
            rabbitmq: 
                condition: service_healthy
        networks: 
            - distribuidos-network
            
    vehiculo:
        build:
            context: ./VehiculoA/VehiculoA.Api
            dockerfile: Dockerfile
        image: acraplicacionesdistribuidas.azurecr.io/vehiculo-service:v1
        container_name: vehiculo-api-compose
        ports:
            - "5002:8080"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: "http://+:8080"
            ConnectionStrings__VehiculosConnection: "Server=tcp:jose-sqlserver-distribuidas3.database.windows.net,1433;Initial Catalog=VehiculoDB_A;Persist Security Info=False;User ID=sqladminuser;Password=JoseAzure2026@;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
            RabbitMQ__HostName: rabbitmq
            RabbitMQ__Port: 5672
            RabbitMQ__UserName: admin
            RabbitMQ__Password: admin123
            RabbitMQ__QueueName: categoria_creada
        depends_on: 
            rabbitmq: 
                condition: service_healthy
        networks: 
            - distribuidos-network
                
    apigateway:
        build:
            context: ./ApiGatewayA
            dockerfile: /ApiGatewayA/Dockerfile
        image: acraplicacionesdistribuidas.azurecr.io/gateway-service:v1
        container_name: apigatewayA-api-compose
        ports:
            - "5000:8080"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: "http://+:8080"
            ReverseProxy__Clusters__authCluster__Destinations__authDestination__Address: "http://oauthjwt:8080/"
            ReverseProxy__Clusters__categoriasCluster__Destinations__categoriasDestination__Address: "http://categoria:8080/"
            ReverseProxy__Clusters__vehiculosCluster__Destinations__vehiculosDestination__Address: "http://vehiculo:8080/"
        depends_on:
            - oauthjwt
            - categoria 
            - vehiculo
        networks:
            - distribuidos-network
            
networks:
    distribuidos-network:
        external: true